query PocketBypass($owner: String!, $name: String!, $number: Int!) {
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      headRefOid
      headRefName
      isCrossRepository
      commits(last: 1) {
        nodes {
          commit {
            oid
            associatedPullRequests(first: 20) {
              pageInfo {
                hasNextPage
              }
              nodes {
                number
                state
                headRefOid
              }
            }
          }
        }
      }
      author {
        __typename
        login
      }
      reviewThreads(first: 100) {
        pageInfo {
          hasNextPage
        }
        nodes {
          isResolved
        }
      }
      latestOpinionatedReviews(first: 100) {
        pageInfo {
          hasNextPage
        }
        nodes {
          state
          authorCanPushToRepository
          author {
            login
          }
          commit {
            oid
          }
        }
      }
    }
  }
}
