# Tool pins for this repository (frostyard core ADR-0043). Locally, `mise
# install` installs golangci-lint and Node from the pins below, and Go from
# go.mod's go line, the only Go pin; never pin Go here. mise.lock records the
# resolved versions and checksums of all three. CI uses setup-go for Go and
# mise for golangci-lint and Node.
[settings]
idiomatic_version_file_enable_tools = ["go"]
lockfile = true

[tools]
# The pinned lint of make verify; the fleet version (frostyard-go-repo skill,
# Fleet toolchain).
golangci-lint = "2.15.0"
# The template gate (make verify) runs scripts/check-template.mjs and the Node
# tests, and make ci runs the js/wasm tests under Node. Node 24 LTS.
node = "24.22.2"
