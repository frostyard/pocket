# golangci-lint v2 (the release mise.toml pins). The standard linters, gofmt
# with simplification, and errcheck relaxed in tests (frostyard-go-repo skill).
version: "2"

linters:
  default: standard
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
